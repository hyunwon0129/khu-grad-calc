# main 브랜치에 push하면 테스트 후 GitHub Pages에 배포 (무료, 배포 횟수 제한 없음)
# 한 번만: 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정
# 주소: https://hyunwon0129.github.io/khu-grad-calc/
# 로그인 서버 값은 브라우저에 공개되는 값이라 여기 적는다 (service_role·sb_secret_ 키는 절대 넣지 않는다)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      # Netlify와 같은 단일 파일 배포본 (CSP 해시 포함)
      - run: PREVIEW=1 npx vite build && NETLIFY=1 node scripts/make-deploy-zip.mjs
        env:
          VITE_SUPABASE_URL: https://bqjfztnkaifsiutpygfy.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_FaEHoCL1J4GQ35h3DvEceQ_F4h-bikU
          VITE_AUTH_PROVIDERS: ''
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/khu-grad-calc-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
